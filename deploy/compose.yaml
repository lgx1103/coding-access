name: coding-access
services:
  coding-access:
    image: coding-access-runtime
    build:
      context: ..
      dockerfile: deploy/Dockerfile.runtime
    env_file: ../.env
    environment:
      NODE_ENV: production
      ACA_HOST: 0.0.0.0
      ACA_PORT: 4317
      ACA_DB_PATH: /app/.local/access.sqlite
      ACA_DOWNLOADS_DIR: /app/release
    ports:
      - "${ACA_BIND_ADDRESS:-127.0.0.1}:${ACA_PUBLIC_PORT:-4317}:4317"
    volumes:
      - ../.local:/app/.local
      - ../release:/app/release:ro
      - ../.env:/app/.env:ro
    restart: unless-stopped
    init: true
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
